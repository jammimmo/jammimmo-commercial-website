name = "jammimmo-commercial-website"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Workers KV — used by /api/revalidate to debounce bursts of webhook calls.
# Bootstrap once: `wrangler kv:namespace create REFRESH_KV`
# then paste the returned id below.
[[kv_namespaces]]
binding = "REFRESH_KV"
id = "e89ce8bc0c73414bb5eeca29b76a033b"

# D1 intake DB — backs /api/leads and /api/views. Schema lives in
# d1/migrations/. Bootstrap once:
#   wrangler d1 create jammimmo-intake
#   # paste the returned database_id below, then:
#   wrangler d1 execute jammimmo-intake --remote --file=d1/migrations/0001_init.sql
[[d1_databases]]
binding = "INTAKE_DB"
database_name = "jammimmo-intake"
database_id = "b4847f4d-9c30-4996-9770-077a73e5b0c1"

# Shared binding: existing gated chat and trusted publication-time localization.
# Listing requests require their separate HMAC secret and durable reservation.
[ai]
binding = "AI"

# Dedicated private chat bucket, created 2026-10-31; public access disabled.
# Shared only by chat processing in Estate Flow. No public object URLs.
# Files stay disabled until scanner pairing AND the native R2 expiry rule
# for chat/quarantine/ have been verified; see docs/chatbot-deployment.md.
[[r2_buckets]]
binding = "CHAT_FILES"
bucket_name = "jammimmo-chat-private"

# No [vars] block on purpose — runtime env (REVALIDATE_HMAC_SECRET,
# GH_DISPATCH_TOKEN, GH_REPO and CHAT_* release gates) is set via the
# Cloudflare Pages dashboard / `wrangler pages secret put` so secrets never
# sit in this repo. Binding declarations alone do not enable chat/AI/files.
